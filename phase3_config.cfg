# Phase 3 Configuration File
# This config follows the specification for the 10 trace files

[pipeline]
forwarding_enabled = true

[latencies]
ADD = 1
MUL = 3

[memory]
# L1 Data Cache: 4KB direct mapped, 1 cycle latency
l1d_size = 4096
l1d_block_size = 64
l1d_assoc = 1
l1d_latency = 1

# No L2 cache
l2_size = 0
l2_block_size = 64
l2_assoc = 1
l2_latency = 0

# Main memory latency
mem_latency = 100

# Replacement policy for cache
replacement_policy = lru

[vm]
# Virtual and physical memory sizes
virtual_size_bytes = 536870912    # 512 MB (enough for all trace addresses)
physical_size_bytes = 262144      # 256 KB = 64 frames * 4KB pages
page_size_bytes = 4096            # 4 KB pages

# DTLB configuration
dtlb_entries = 16
tlb_hit_latency = 1
page_walk_latency = 10
page_fault_latency = 50

# Page replacement policy
replacement_policy = lru

[simulator]
max_cycles = 100000000
trace_mode = true
